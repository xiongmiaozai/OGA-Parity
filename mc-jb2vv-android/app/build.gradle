plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.mcjb2vv.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mcjb2vv.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // 仅打包主流 ARM 架构，减小体积
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        python {
            version "3.11"
            // 本地用于构建的 Python（沙箱为 pyenv 3.11.1），与 target 版本一致
            buildPython "python3"
            pip {
                install "flask"
                install "werkzeug"
                install "pillow"
                install "numpy"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['**/*.pyc', '**/__pycache__/**']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
